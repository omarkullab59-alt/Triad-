# Cloudflare Worker for the TRIAD Finder (photo + AI search).
# Deployed by .github/workflows/deploy-worker.yml — see docs/KI-FINDER.md
name = "triad-finder-ai"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://omarkullab59-alt.github.io,http://localhost:4321"
MODEL = "claude-haiku-4-5"

# Per-visitor limit: 10 AI searches per minute per IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
