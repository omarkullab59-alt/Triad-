name: Deploy Studio AI (Cloudflare Worker)

# Publishes worker/ to Cloudflare's free plan (Workers AI daily free allocation, no credit card).
# Needs two repository SECRETS (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   token with the template "Edit Cloudflare Workers" + "Workers AI: Read"
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (right column on "Workers & Pages")
# See docs/SETUP.md.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Worker tests (mocked AI)
        run: node --test tests/worker.test.mjs
      - name: Check secrets
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF" ] || [ -z "$ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Studio AI not deployed: Cloudflare secrets missing (see docs/SETUP.md)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy worker
        id: deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
      - name: Show URL
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "### Studio AI is live" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Save it as repository variable STUDIO_AI_URL, then run 'Build & deploy TRIAD Studio'." >> "$GITHUB_STEP_SUMMARY"
