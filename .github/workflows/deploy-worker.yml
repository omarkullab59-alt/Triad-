name: Deploy Finder AI (Cloudflare Worker)

# Publishes worker/finder-ai to Cloudflare (free Workers AI, no credit card).
# Needs two repository secrets (Settings → Secrets and variables → Actions):
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. ANTHROPIC_API_KEY is optional.
# Darkroom: DARKROOM_ADMIN_TOKEN (long random password for the moderation page) and
# DARKROOM_HASH_SALT (any random text). See docs/DARKROOM.md.
# See docs/KI-FINDER.md.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Unit tests (mocked AI + real SQLite for D1)
        run: node tests/worker.test.mjs && node tests/darkroom.test.mjs

      - name: Check secrets
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF" ] || [ -z "$ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Finder AI not deployed: secrets missing (see docs/KI-FINDER.md)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy worker
        id: deploy
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/finder-ai
          wranglerVersion: "4"
          secrets: |
            ADMIN_TOKEN
            HASH_SALT
        env:
          ADMIN_TOKEN: ${{ secrets.DARKROOM_ADMIN_TOKEN }}
          HASH_SALT: ${{ secrets.DARKROOM_HASH_SALT }}

      - name: Show URL
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "### Finder AI is live" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker URL: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Copy this URL into the CMS → Startseite & Allgemein → KI-Finder Adresse." >> "$GITHUB_STEP_SUMMARY"
