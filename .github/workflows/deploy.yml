name: Build & deploy TRIAD

# Runs on every push to main (new article, upload, code change) and every 3 hours
# to refresh the news wire. Publishes dist/ to the gh-pages branch.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch news wire (RSS headlines)
        run: node scripts/fetch-wire.mjs
        continue-on-error: true

      - name: Self-host fonts (privacy + speed; falls back to Google if it fails)
        run: node scripts/fetch-fonts.mjs

      - name: Build
        run: node scripts/build.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Optimise uploaded images (max 2000px, ~82% quality)
        run: |
          shopt -s nullglob nocaseglob
          files=(dist/uploads/*.{jpg,jpeg,png,webp})
          [ ${#files[@]} -eq 0 ] && exit 0
          command -v mogrify >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          mogrify -auto-orient -resize '2000x2000>' -strip -quality 82 "${files[@]}"
          du -sh dist/uploads

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
